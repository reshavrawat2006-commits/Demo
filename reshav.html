
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }

        .hero h1 {
            font-size: 44px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #2563eb;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .about {
            text-align: center;
            padding: 60px 20px;
        }

        .about h2 {
            margin-bottom: 15px;
        }

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>MyWebsite</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Welcome to My Website</h1>
        <p>Create something amazing with a beautiful website.</p>
        <a href="#about" class="btn">Get Started</a>
    </section>

    <section class="about" id="about">
        <h2>About Us</h2>
        <p>We build simple, creative, and responsive websites.</p>
    </section>

    <footer id="contact">
        <p>Contact: hello@example.com</p>
        <p>© 2026 MyWebsite. All rights reserved.</p>
    </footer>

</body>
</html>
